naftiko: "1.0.0-alpha1"

info:
  label: "Talend Cloud Processing API"
  description: >-
    Execute and monitor task and plan runs, manage remote engines and clusters,
    and configure run profiles in Qlik Talend Cloud.
  tags:
    - Data Integration
    - ETL
    - Execution
    - Remote Engine
    - Talend
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TALEND_ACCESS_TOKEN: TALEND_ACCESS_TOKEN
      TALEND_REGION: TALEND_REGION

capability:
  consumes:
    - type: http
      namespace: talend-processing
      baseUri: "https://api.{{TALEND_REGION}}.cloud.talend.com"
      description: "Talend Cloud Processing API"
      authentication:
        type: bearer
        token: "{{TALEND_ACCESS_TOKEN}}"
      resources:
        - name: task-executions
          path: /processing/executions
          description: "Execute and manage task runs"
          operations:
            - name: execute-task
              method: POST
              description: "Trigger execution of a data integration task"
              body:
                type: json
                data:
                  taskId: "{{tools.task_id}}"
                  environmentId: "{{tools.environment_id}}"
                  logLevel: "{{tools.log_level}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: task-execution-status
          path: /processing/executions/{executionId}
          description: "Get status of a task execution"
          operations:
            - name: get-task-execution-status
              method: GET
              description: "Check execution status and details"
              inputParameters:
                - name: executionId
                  in: path
                  type: string
                  required: true
                  description: "Execution identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: task-execution-list
          path: /processing/executables/tasks/executions
          description: "List task execution history"
          operations:
            - name: list-task-executions
              method: GET
              description: "List all task executions with optional filters"
              inputParameters:
                - name: taskId
                  in: query
                  type: string
                  required: false
                  description: "Filter by task ID"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status (RUNNING, SUCCESS, FAILURE, CANCELLED)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

        - name: plan-executions
          path: /processing/executions/plans
          description: "Execute plans"
          operations:
            - name: execute-plan
              method: POST
              description: "Trigger execution of a data integration plan"
              body:
                type: json
                data:
                  planId: "{{tools.plan_id}}"
                  environmentId: "{{tools.environment_id}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: remote-engines
          path: /processing/runtimes/remote-engines
          description: "Manage remote engines"
          operations:
            - name: list-remote-engines
              method: GET
              description: "List all available remote engines"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

  exposes:
    - type: rest
      port: 8101
      namespace: talend-processing-rest
      resources:
        - path: /v1/executions
          name: executions
          description: "Task execution management"
          operations:
            - method: POST
              name: execute-task
              description: "Run a task"
              call: "talend-processing.execute-task"
              with:
                task_id: "rest.taskId"
                environment_id: "rest.environmentId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/executions/{executionId}
          name: execution-status
          description: "Get execution status"
          operations:
            - method: GET
              name: get-task-execution-status
              description: "Get execution status"
              call: "talend-processing.get-task-execution-status"
              with:
                executionId: "rest.executionId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/remote-engines
          name: remote-engines
          description: "Remote engine management"
          operations:
            - method: GET
              name: list-remote-engines
              description: "List remote engines"
              call: "talend-processing.list-remote-engines"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: talend-processing-mcp
      transport: http
      tools:
        - name: execute-task
          description: "Trigger execution of a Talend data integration task"
          hints:
            readOnly: false
            openWorld: false
          call: "talend-processing.execute-task"
          with:
            task_id: "tools.task_id"
            environment_id: "tools.environment_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-execution-status
          description: "Check the status of a running or completed task execution"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-processing.get-task-execution-status"
          with:
            executionId: "tools.execution_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-task-executions
          description: "List task execution history with optional filters by task ID or status"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-processing.list-task-executions"
          with:
            taskId: "tools.task_id"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."

        - name: execute-plan
          description: "Trigger execution of a multi-step data integration plan"
          hints:
            readOnly: false
            openWorld: false
          call: "talend-processing.execute-plan"
          with:
            plan_id: "tools.plan_id"
            environment_id: "tools.environment_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-remote-engines
          description: "List all remote Talend engines available for task execution"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-processing.list-remote-engines"
          outputParameters:
            - type: object
              mapping: "$."
