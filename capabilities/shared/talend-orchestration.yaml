naftiko: "1.0.0-alpha1"

info:
  label: "Talend Cloud Orchestration API"
  description: >-
    Manage tasks, plans, schedules, workspaces, environments, connections,
    artifacts, and promotions in Qlik Talend Cloud.
  tags:
    - Data Integration
    - ETL
    - Orchestration
    - Talend
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TALEND_ACCESS_TOKEN: TALEND_ACCESS_TOKEN
      TALEND_REGION: TALEND_REGION

capability:
  consumes:
    - type: http
      namespace: talend-orchestration
      baseUri: "https://api.{{TALEND_REGION}}.cloud.talend.com"
      description: "Talend Cloud Orchestration API"
      authentication:
        type: bearer
        token: "{{TALEND_ACCESS_TOKEN}}"
      resources:
        - name: workspaces
          path: /orchestration/workspaces
          description: "Manage Talend Cloud workspaces"
          operations:
            - name: list-workspaces
              method: GET
              description: "List all workspaces in the account"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"
            - name: create-workspace
              method: POST
              description: "Create a new workspace"
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tasks
          path: /orchestration/executables/tasks
          description: "Manage data integration tasks"
          operations:
            - name: list-tasks
              method: GET
              description: "List all tasks in the account"
              inputParameters:
                - name: workspaceId
                  in: query
                  type: string
                  required: false
                  description: "Filter by workspace"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"
            - name: create-task
              method: POST
              description: "Create a new data integration task"
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  workspaceId: "{{tools.workspace_id}}"
                  description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: plans
          path: /orchestration/executables/plans
          description: "Manage execution plans"
          operations:
            - name: list-plans
              method: GET
              description: "List all plans"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

        - name: schedules
          path: /orchestration/schedules
          description: "Manage execution schedules"
          operations:
            - name: list-schedules
              method: GET
              description: "List all schedules"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

        - name: environments
          path: /orchestration/environments
          description: "Manage deployment environments"
          operations:
            - name: list-environments
              method: GET
              description: "List all environments"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

        - name: connections
          path: /orchestration/connections
          description: "Manage data source connections"
          operations:
            - name: list-connections
              method: GET
              description: "List all connections"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$.items"

  exposes:
    - type: rest
      port: 8100
      namespace: talend-orchestration-rest
      resources:
        - path: /v1/workspaces
          name: workspaces
          description: "Workspace management"
          operations:
            - method: GET
              name: list-workspaces
              description: "List workspaces"
              call: "talend-orchestration.list-workspaces"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/tasks
          name: tasks
          description: "Task management"
          operations:
            - method: GET
              name: list-tasks
              description: "List tasks"
              call: "talend-orchestration.list-tasks"
              with:
                workspaceId: "rest.workspaceId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: talend-orchestration-mcp
      transport: http
      tools:
        - name: list-workspaces
          description: "List all Talend Cloud workspaces"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-orchestration.list-workspaces"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-tasks
          description: "List data integration tasks, optionally filtered by workspace"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-orchestration.list-tasks"
          with:
            workspaceId: "tools.workspace_id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-plans
          description: "List execution plans in Talend Cloud"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-orchestration.list-plans"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-environments
          description: "List deployment environments in Talend Cloud"
          hints:
            readOnly: true
            openWorld: false
          call: "talend-orchestration.list-environments"
          outputParameters:
            - type: object
              mapping: "$."
