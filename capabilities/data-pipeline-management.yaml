naftiko: 1.0.0-alpha2
info:
  label: Talend Data Pipeline Management
  description: Workflow capability for data engineers and platform teams to manage, execute, and monitor data integration
    pipelines in Qlik Talend Cloud. Combines orchestration (task and plan management) with processing (execution and monitoring)
    for end-to-end pipeline lifecycle management.
  tags:
  - Data Engineering
  - Data Integration
  - ETL
  - Pipeline Management
  - Talend
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TALEND_ACCESS_TOKEN: TALEND_ACCESS_TOKEN
    TALEND_REGION: TALEND_REGION
capability:
  consumes:
  - type: http
    namespace: talend-orchestration
    baseUri: https://api.{{TALEND_REGION}}.cloud.talend.com
    description: Talend Cloud Orchestration API
    authentication:
      type: bearer
      token: '{{TALEND_ACCESS_TOKEN}}'
    resources:
    - name: workspaces
      path: /orchestration/workspaces
      description: Manage Talend Cloud workspaces
      operations:
      - name: list-workspaces
        method: GET
        description: List all workspaces in the account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
      - name: create-workspace
        method: POST
        description: Create a new workspace
        body:
          type: json
          data:
            name: '{{tools.name}}'
            description: '{{tools.description}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: tasks
      path: /orchestration/executables/tasks
      description: Manage data integration tasks
      operations:
      - name: list-tasks
        method: GET
        description: List all tasks in the account
        inputParameters:
        - name: workspaceId
          in: query
          type: string
          required: false
          description: Filter by workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
      - name: create-task
        method: POST
        description: Create a new data integration task
        body:
          type: json
          data:
            name: '{{tools.name}}'
            workspaceId: '{{tools.workspace_id}}'
            description: '{{tools.description}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: plans
      path: /orchestration/executables/plans
      description: Manage execution plans
      operations:
      - name: list-plans
        method: GET
        description: List all plans
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
    - name: schedules
      path: /orchestration/schedules
      description: Manage execution schedules
      operations:
      - name: list-schedules
        method: GET
        description: List all schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
    - name: environments
      path: /orchestration/environments
      description: Manage deployment environments
      operations:
      - name: list-environments
        method: GET
        description: List all environments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
    - name: connections
      path: /orchestration/connections
      description: Manage data source connections
      operations:
      - name: list-connections
        method: GET
        description: List all connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
  - type: http
    namespace: talend-processing
    baseUri: https://api.{{TALEND_REGION}}.cloud.talend.com
    description: Talend Cloud Processing API
    authentication:
      type: bearer
      token: '{{TALEND_ACCESS_TOKEN}}'
    resources:
    - name: task-executions
      path: /processing/executions
      description: Execute and manage task runs
      operations:
      - name: execute-task
        method: POST
        description: Trigger execution of a data integration task
        body:
          type: json
          data:
            taskId: '{{tools.task_id}}'
            environmentId: '{{tools.environment_id}}'
            logLevel: '{{tools.log_level}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: task-execution-status
      path: /processing/executions/{executionId}
      description: Get status of a task execution
      operations:
      - name: get-task-execution-status
        method: GET
        description: Check execution status and details
        inputParameters:
        - name: executionId
          in: path
          type: string
          required: true
          description: Execution identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: task-execution-list
      path: /processing/executables/tasks/executions
      description: List task execution history
      operations:
      - name: list-task-executions
        method: GET
        description: List all task executions with optional filters
        inputParameters:
        - name: taskId
          in: query
          type: string
          required: false
          description: Filter by task ID
        - name: status
          in: query
          type: string
          required: false
          description: Filter by status (RUNNING, SUCCESS, FAILURE, CANCELLED)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
    - name: plan-executions
      path: /processing/executions/plans
      description: Execute plans
      operations:
      - name: execute-plan
        method: POST
        description: Trigger execution of a data integration plan
        body:
          type: json
          data:
            planId: '{{tools.plan_id}}'
            environmentId: '{{tools.environment_id}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: remote-engines
      path: /processing/runtimes/remote-engines
      description: Manage remote engines
      operations:
      - name: list-remote-engines
        method: GET
        description: List all available remote engines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.items
  exposes:
  - type: rest
    port: 8080
    namespace: talend-pipeline-api
    description: Unified REST API for Talend data pipeline management.
    resources:
    - path: /v1/workspaces
      name: workspaces
      description: Manage Talend Cloud workspaces
      operations:
      - method: GET
        name: list-workspaces
        description: List all workspaces in the account
        call: talend-orchestration.list-workspaces
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tasks
      name: tasks
      description: Manage data integration tasks
      operations:
      - method: GET
        name: list-tasks
        description: List tasks, optionally filtered by workspace
        call: talend-orchestration.list-tasks
        with:
          workspaceId: rest.workspaceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/plans
      name: plans
      description: Manage execution plans
      operations:
      - method: GET
        name: list-plans
        description: List all plans
        call: talend-orchestration.list-plans
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/environments
      name: environments
      description: Manage deployment environments
      operations:
      - method: GET
        name: list-environments
        description: List all environments
        call: talend-orchestration.list-environments
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/executions
      name: executions
      description: Trigger and monitor task executions
      operations:
      - method: POST
        name: execute-task
        description: Run a data integration task
        call: talend-processing.execute-task
        with:
          task_id: rest.taskId
          environment_id: rest.environmentId
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-task-executions
        description: List task execution history
        call: talend-processing.list-task-executions
        with:
          taskId: rest.taskId
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/executions/{executionId}
      name: execution-detail
      description: Get execution status and details
      operations:
      - method: GET
        name: get-execution-status
        description: Check execution status
        call: talend-processing.get-task-execution-status
        with:
          executionId: rest.executionId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/plan-executions
      name: plan-executions
      description: Trigger and monitor plan executions
      operations:
      - method: POST
        name: execute-plan
        description: Run a data integration plan
        call: talend-processing.execute-plan
        with:
          plan_id: rest.planId
          environment_id: rest.environmentId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/remote-engines
      name: remote-engines
      description: View remote engine status
      operations:
      - method: GET
        name: list-remote-engines
        description: List available remote engines
        call: talend-processing.list-remote-engines
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections
      name: connections
      description: Manage data source connections
      operations:
      - method: GET
        name: list-connections
        description: List all connections
        call: talend-orchestration.list-connections
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: talend-pipeline-mcp
    transport: http
    description: MCP server for AI-assisted Talend data pipeline management.
    tools:
    - name: list-workspaces
      description: List all Talend Cloud workspaces available in the account
      hints:
        readOnly: true
        openWorld: false
      call: talend-orchestration.list-workspaces
      outputParameters:
      - type: object
        mapping: $.
    - name: list-tasks
      description: List data integration tasks, optionally filtered by workspace ID
      hints:
        readOnly: true
        openWorld: false
      call: talend-orchestration.list-tasks
      with:
        workspaceId: tools.workspace_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-plans
      description: List execution plans composed of multiple data integration tasks
      hints:
        readOnly: true
        openWorld: false
      call: talend-orchestration.list-plans
      outputParameters:
      - type: object
        mapping: $.
    - name: list-environments
      description: List deployment environments (development, staging, production)
      hints:
        readOnly: true
        openWorld: false
      call: talend-orchestration.list-environments
      outputParameters:
      - type: object
        mapping: $.
    - name: list-connections
      description: List data source and destination connections configured in Talend
      hints:
        readOnly: true
        openWorld: false
      call: talend-orchestration.list-connections
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-task
      description: Trigger execution of a Talend data integration task in a specified environment
      hints:
        readOnly: false
        openWorld: false
      call: talend-processing.execute-task
      with:
        task_id: tools.task_id
        environment_id: tools.environment_id
        log_level: tools.log_level
      outputParameters:
      - type: object
        mapping: $.
    - name: get-execution-status
      description: Check the current status of a task or plan execution
      hints:
        readOnly: true
        openWorld: false
      call: talend-processing.get-task-execution-status
      with:
        executionId: tools.execution_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-task-executions
      description: List task execution history filtered by task ID, status, or time range
      hints:
        readOnly: true
        openWorld: false
      call: talend-processing.list-task-executions
      with:
        taskId: tools.task_id
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: execute-plan
      description: Run a multi-step data integration plan from start or resume from a failed step
      hints:
        readOnly: false
        openWorld: false
      call: talend-processing.execute-plan
      with:
        plan_id: tools.plan_id
        environment_id: tools.environment_id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-remote-engines
      description: List remote Talend execution engines with their status and capabilities
      hints:
        readOnly: true
        openWorld: false
      call: talend-processing.list-remote-engines
      outputParameters:
      - type: object
        mapping: $.
