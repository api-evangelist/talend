naftiko: 1.0.0-alpha2
info:
  label: Talend Cloud Orchestration API — Schedules
  description: 'Talend Cloud Orchestration API — Schedules. 2 operations. Lead operation: List Schedules. Self-contained Naftiko
    capability covering one Talend business surface.'
  tags:
  - Talend
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TALEND_API_KEY: TALEND_API_KEY
capability:
  consumes:
  - type: http
    namespace: orchestration-schedules
    baseUri: https://api.{region}.cloud.talend.com
    description: Talend Cloud Orchestration API — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: orchestration-schedules
      path: /orchestration/schedules
      operations:
      - name: listschedules
        method: GET
        description: List Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createschedule
        method: POST
        description: Create Schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TALEND_API_KEY}}'
  exposes:
  - type: rest
    namespace: orchestration-schedules-rest
    port: 8080
    description: REST adapter for Talend Cloud Orchestration API — Schedules. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/orchestration/schedules
      name: orchestration-schedules
      description: REST surface for orchestration-schedules.
      operations:
      - method: GET
        name: listschedules
        description: List Schedules
        call: orchestration-schedules.listschedules
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createschedule
        description: Create Schedule
        call: orchestration-schedules.createschedule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: orchestration-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Talend Cloud Orchestration API — Schedules. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-schedules
      description: List Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: orchestration-schedules.listschedules
      outputParameters:
      - type: object
        mapping: $.
    - name: create-schedule
      description: Create Schedule
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: orchestration-schedules.createschedule
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
