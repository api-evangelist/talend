          in: query
          type: string
          description: Filter tasks by workspace
        - name: limit
          in: query
          type: integer
          description: Maximum number of tasks to return
        - name: offset
          in: query
          type: integer
          description: Number of tasks to skip
      - name: createtask
        method: POST
        description: Create Task
        outputRawFormat: json
        outputParameters:
        - name: result
