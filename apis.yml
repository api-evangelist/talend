aid: talend

name: Talend

description: Talend (now part of Qlik) provides data integration, quality, and API management capabilities through cloud-native APIs for ETL,
  data pipelines, and application integration. The Qlik Talend Cloud platform exposes REST APIs for orchestrating tasks and plans, executing data
  integration jobs, managing remote engines, configuring connections, monitoring execution history, and administering identities, workspaces,
  and environments.

type: Index

