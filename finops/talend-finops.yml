principles:
  - name: Visibility
    description: Subscription consumption is reported through the Talend / Qlik customer success
      channel and the product's own usage views; no public usage API ships at the platform level.
  - name: Allocation
    description: Allocation is performed against the line items on the customer's Talend / Qlik
      subscription invoice in the consumer's own ERP.
  - name: Optimization
    description: Optimization levers are addressed through pipeline consolidation, schedule tuning,
      and subscription right-sizing during renewal cycles.
  - name: Accountability
    description: Accountability sits with the data engineering or platform owner holding the
      Talend / Qlik subscription.
