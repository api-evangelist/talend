specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Talend
providerId: talend
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Data Integration
  - ETL
  - Data Quality
description: Talend (acquired by Qlik) does not publish public list pricing for its Data Integration
  and Data Fabric products. The public talend.com/pricing page redirects to the Qlik pricing index,
  which surfaces a request-pricing flow rather than published per-tier prices.
sources:
  - https://www.talend.com/
  - https://www.qlik.com/us/pricing/data-integration-products-pricing
notes: Public pricing page redirects to Qlik's data-integration pricing index and exposes no
  published list prices. Plans collapsed to a single Contact Sales entry pending direct provider
  confirmation.
plans:
  - id: talend-contact-sales
    name: Contact Sales
    type: enterprise
    description: Custom-quoted Talend / Qlik Data Integration subscriptions. Pricing depends on
      product line (Data Fabric, Data Integration, Data Quality, Cloud, Stitch), deployment model,
      and committed-use volume.
    entries:
      - label: Custom Subscription
        name: custom_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Custom Scoping
      - name: Direct Sales Engagement
      - name: Subscription Agreement
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
