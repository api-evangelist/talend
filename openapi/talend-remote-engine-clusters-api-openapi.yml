openapi: 3.2.0
info:
  title: Talend Cloud Processing Remote Engine Clusters API
  description: The Talend Cloud Processing API manages task and plan executions, remote engine lifecycle, and run profiles in Qlik Talend Cloud. Use this API to trigger and monitor data integration job runs, manage remote engine clusters, and configure execution run profiles.
  version: 2021-03
  contact:
    name: Qlik Talend Support
    url: https://talend.qlik.dev
  termsOfService: https://www.qlik.com/us/legal/license-terms
servers:
- url: https://api.{region}.cloud.talend.com
  description: Talend Cloud API
  variables:
    region:
      description: Cloud region
      default: eu
      enum:
      - eu
      - us
      - us-west
      - ap
      - au
security:
- BearerAuth: []
tags:
- name: Remote Engine Clusters
paths:
  /processing/runtimes/remote-engine-clusters:
    get:
      operationId: listRemoteEngineClusters
      summary: List Remote Engine Clusters
      description: Get all remote engine clusters in the account
      tags:
      - Remote Engine Clusters
      responses:
        '200':
          description: List of remote engine clusters
    post:
      operationId: createRemoteEngineCluster
      summary: Create Remote Engine Cluster
      description: Create a new remote engine cluster for load balancing
      tags:
      - Remote Engine Clusters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Cluster created
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token from Talend Cloud personal access token or service account token
externalDocs:
  description: Talend Processing API Documentation
  url: https://talend.qlik.dev/apis/processing/2021-03/
