openapi: 3.0.3
info:
  title: Talend Cloud Orchestration Artifacts Remote Engine Clusters API
  description: The Talend Cloud Orchestration API manages tasks, plans, schedules, workspaces, environments, artifacts, connections, promotions, and resources in Qlik Talend Cloud. Use this API to automate data integration pipeline management, configure execution schedules, and manage workspace resources.
  version: 2021-03
  contact:
    name: Qlik Talend Support
    url: https://talend.qlik.dev
  termsOfService: https://www.qlik.com/us/legal/license-terms
servers:
- url: https://api.{region}.cloud.talend.com
  description: Talend Cloud API
  variables:
    region:
      description: Cloud region
      default: eu
      enum:
      - eu
      - us
      - us-west
      - ap
      - au
security:
- BearerAuth: []
tags:
- name: Remote Engine Clusters
paths:
  /processing/runtimes/remote-engine-clusters:
    get:
      operationId: listRemoteEngineClusters
      summary: List Remote Engine Clusters
      description: Get all remote engine clusters in the account
      tags:
      - Remote Engine Clusters
      responses:
        '200':
          description: List of remote engine clusters
    post:
      operationId: createRemoteEngineCluster
      summary: Create Remote Engine Cluster
      description: Create a new remote engine cluster for load balancing
      tags:
      - Remote Engine Clusters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Cluster created
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token from Talend Cloud personal access token or service account token
externalDocs:
  description: Talend Orchestration API Documentation
  url: https://talend.qlik.dev/apis/orchestration/2021-03/
