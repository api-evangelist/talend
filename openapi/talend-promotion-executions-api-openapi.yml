openapi: 3.2.0
info:
  title: Talend Cloud Processing Promotion Executions API
  description: The Talend Cloud Processing API manages task and plan executions, remote engine lifecycle, and run profiles in Qlik Talend Cloud. Use this API to trigger and monitor data integration job runs, manage remote engine clusters, and configure execution run profiles.
  version: 2021-03
  contact:
    name: Qlik Talend Support
    url: https://talend.qlik.dev
  termsOfService: https://www.qlik.com/us/legal/license-terms
servers:
- url: https://api.{region}.cloud.talend.com
  description: Talend Cloud API
  variables:
    region:
      description: Cloud region
      default: eu
      enum:
      - eu
      - us
      - us-west
      - ap
      - au
security:
- BearerAuth: []
tags:
- name: Promotion Executions
paths:
  /processing/executions/promotions:
    post:
      operationId: executePromotion
      summary: Execute Promotion
      description: Execute a promotion from source environment to target environment
      tags:
      - Promotion Executions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                promotionId:
                  type: string
                  description: The promotion to execute
      responses:
        '200':
          description: Promotion execution started
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token from Talend Cloud personal access token or service account token
externalDocs:
  description: Talend Processing API Documentation
  url: https://talend.qlik.dev/apis/processing/2021-03/
