    - url: https://api.au.cloud.talend.com
      description: URL for the AWS Australia region
      x-talend:
        isPublished: true
    - url: https://api.us-west.cloud.talend.com
      description: URL for the Azure United States West region
      x-talend:
        isPublished: true
  /security/role-mappings/{customerRoleName}:
    summary: Operations on a specific role mapping
    description: 'A role mapping can be targeted specifically using the customer role name to retrieve or delete it. '
    parameters:
    - name: customerRoleName
      in: path
      required: true
      description: Customer role name
      schema:
        type: string
        description: Customer role name
      example: role_1
    get:
      summary: Get a specific role mapping
      description: Get a specific role mapping for your tenant.
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleMapping'
              example: "{\n  \"name\":\"role_1\",\n  \"roles\":[\n    \"talend_role_1\",\n    \"talend_role_2\",\n    \"talend_role_3\"\n  ]\n}"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
      - Security
      operationId: getSecurityRoleMappingsByCustomerRoleName
      x-operation-id-source: derived
    delete:
      summary: Delete a specific role mapping
      description: Delete a specific role mappings for your tenant.
      responses:
        '204':
          description: Status 204
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
      - Security
      operationId: deleteSecurityRoleMappingsByCustomerRoleName
      x-operation-id-source: derived
    servers:
    - url: https://api.eu.cloud.talend.com
      description: URL for the AWS Europe region
      x-talend:
        isPublished: true
    - url: https://api.ap.cloud.talend.com
      description: URL for the AWS Asia Pacific region
      x-talend:
        isPublished: true
    - url: https://api.us.cloud.talend.com
      description: URL for the AWS United States East region
      x-talend:
        isPublished: true
    - url: https://api.au.cloud.talend.com
      description: URL for the AWS Australia region
      x-talend:
