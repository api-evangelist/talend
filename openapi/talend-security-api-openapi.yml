    - url: https://api.us-west.cloud.talend.com
      description: URL for the Azure United States West region
      x-talend:
        isPublished: true
components:
  schemas:
    TokenRequest:
      type: object
      required:
      - audience
      - grant_type
      description: A token request is an object used to obtain an access token through the OAuth 2 Client Credentials Grant flow.
      properties:
        grant_type:
          type: string
          description: The OAuth 2 flow that must be used to obtain an access token. The value must be set to "client_credentials".
          example: client_credentials
        audience:
          type: string
          description: The unique identifier of the target API to access
          example: https://api.eu.cloud.talend.com/
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      description: Access token is returned in this response.
      properties:
        access_token:
          type: string
          description: The access token obtained in JWT format.
          example: your_personal_token
        token_type:
          type: string
          description: The type of the token issued as described in the OAuth 2 specification. The value is usually "Bearer".
          example: Bearer
        expires_in:
          type: string
          description: The lifetime in seconds of the access token. For example, the value 3600 denotes that the access token expires at the end of one hour from the time the response is generated.
          example: '3600'
    RoleMapping:
      type: object
      required:
      - name
      - roles
      properties:
        name:
          type: string
          description: Customer role name
        roles:
          type: array
          description: Talend roles name
          items:
            type: string
      example: "{\n  \"name\":\"role_1\",\n  \"roles\":[\n    \"talend_role_1\",\n    \"talend_role_2\",\n    \"talend_role_3\"\n  ]\n}"
  parameters:
    talendVersion:
      name: talendVersion
      in: query
      required: false
      description: API version
      schema:
        type: string
        description: API version
    talend-version:
      name: talend-version
      in: header
      required: false
      description: API version
      schema:
        type: string
        description: API version
  responses:
    429TooManyRequests:
      description: Too many requests were sent. Check the X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset headers.
    500InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request.
    404NotFound:
      description: Resource not found.
    400BadRequest:
      description: Invalid request body. The message varies depending on the cause of the bad request. For example, the cause could be a malformed body or parameter.
    401Unauthorized:
      description: The system failed to authenticate the user. Either the Authorization header was missing or the provided token was incorrect.
    403Forbidden:
      description: The system failed to authorize the user. The provided token was recognized but did not have the rights to perform the action. Contact your security administrator to get the appropriate rights.
  securitySchemes:
    Public:
      type: http
      scheme: basic
