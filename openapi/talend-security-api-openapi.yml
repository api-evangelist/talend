info:
  title: Talend Security API
  version: 2021-03
  contact: {}
  description: 'Operations tagged Security across 2 of this provider''s published API definitions: oauth-openapi.json, sso-role-mapping-openapi.json. Each path carries the servers of the definition it was published in.'
