    ComponentFieldFilter:
      type: object
      required:
      - field
      - operator
      - value
      properties:
        field:
          type: string
          description: Field filter name
          enum:
          - engine_id
          - workspace_id
          - task_id
          - task_execution_id
          - job_name
          - connector_type
          - connector_label
          - connector_id
          - component_start_time_seconds
          - operator
          - operator_type
        operator:
          type: string
          description: 'Field filter operator

            - Field `component_start_time_seconds` supports `gt, gte, lt, lte`, others support `in`

            - Can''t use more than `2` operators

            - Can''t use any `2` same operators

            - Can''t use `gt` together with `gte`

            - Can''t use `lt`together with `lte`

            - When use `gt/gte` and `lt` together, value of `lt` must be greater than value of `gt/gte`

            - When use `gte` and `lt` together, value of `lt` must be greater than value of `gte`

            - When use `gte` and `lte` together, value of `lte` must be greater than or equals to value of `gte`'
          enum:
          - in
          - gt
          - gte
          - lt
          - lte
        value:
          type: object
          description: "Field filter value\n\nFor operator `in` requires an array, like \n- `\"value\" : [\"value\"]`\n- `\"value\" : [\"value1\", \"value2\"]`\n\nFor operator `gt, gte, lt, lte` requres a number(or a string of number), like \n- `\"value\" : 1628266578`\n- `\"value\" : 1628266578.78`\n- `\"value\" : \"1628266578\"`\n-  `\"value\" : \"1628266578.78\"`"
      example: "{\n    \"field\": \"engine_id\", \n    \"operator\": \"in\", \n    \"value\": [\"a60bb1c0-7669-407f-9326-138af05da18a\"]\n}"
    ProcessMetric:
      type: object
      required:
      - father_pid
      - job_name
      - pid
      - process_id
      - root_pid
      properties:
        process_id:
          type: string
          description: Process ID. This is JVM's UUID
          example: c151b20d-cb9a-34ad-b219-2080761dd193
        job_name:
          type: string
          description: Job Name
          example: sub_job_2
        pid:
          type: string
          description: PID. This is the unique Job identifier for the current run
          example: WTHlkK
        father_pid:
          type: string
          description: ID of the first direct parent Job
          example: 20210827095720_E61Q1
        root_pid:
          type: string
          description: ID of the first root Job if there are several Subjobs
          example: 20210827095720_E61Q1
      example: "{\n    \"process_id\" : \"c151b20d-cb9a-34ad-b219-2080761dd193\",\n    \"job_name\" : \"sub_job_2\",\n    \"pid\" : \"WTHlkK\",\n    \"father_pid\" : \"20210827095720_E61Q1\",\n    \"root_pid\" : \"20210827095720_E61Q1\"\n}"
